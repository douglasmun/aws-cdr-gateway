name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only reads the repo and uploads an artifact (which uses
# the Actions API, not token write scope). No need for the default broader token.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Python 3.12 matches the Lambda runtime in src/template.yaml and the pinned
    # pikepdf/Pillow wheels. Bump both together if the runtime changes.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
          # Local CDR service deps (FastAPI/uvicorn/httpx) — needed to import src/app.py
          # and run src/test_cdr_local.py. Kept out of the Lambda layer (requirements.txt).
          pip install -r src/requirements-local.txt
          pip install pytest

      - name: Byte-compile (lint)
        run: |
          python -m py_compile \
            src/lambda_function.py \
            src/app.py \
            docs/benchmark.py \
            docs/fixtures/generate_fixtures.py

      - name: Run tests
        working-directory: src
        # Both suites: the CDR Lambda (test_cdr.py) and the local FastAPI service +
        # cdr_dispatch core (test_cdr_local.py).
        run: pytest test_cdr.py test_cdr_local.py -v

      - name: Check documented test counts are current
        working-directory: ${{ github.workspace }}
        # The suite size is quoted in several docs and drifts silently as tests are
        # added. Fail the build on a stale number rather than mislead the next reader.
        run: python scripts/check_test_count.py

      - name: Check documented cap defaults match the code
        working-directory: ${{ github.workspace }}
        # Retuning a CDR_MAX_* cap silently invalidates every doc quoting its old default.
        # CDR_MAX_TOTAL_BYTES stayed documented as 1 GiB for months after being retuned to
        # 512 MB, implying the decompression budget sat above MemorySize when the point of
        # the retune was putting it under.
        run: python scripts/check_cap_defaults.py

  build-package:
    # Verify the Lambda deployment package builds with Linux wheels. Runs on Linux so the
    # manylinux wheels are the native platform; catches dependency/packaging breakage.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Lambda package
        run: ./scripts/build.sh

      - name: Check the package contains the handler and Linux binaries
        run: |
          # -Z1 lists bare archive paths one per line; -x matches the whole line so the
          # handler check
          unzip -Z1 build/lambda.zip | grep -qx "lambda_function.py"
          # At least one cp312 x86_64 Linux shared object must be present.
          unzip -Z1 build/lambda.zip | grep -q "cpython-312-x86_64-linux-gnu\.so$"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-zip
          path: build/lambda.zip
          if-no-files-found: error

  terraform-validate:
    # The terraform/ path provisions the same stack as src/template.yaml but was
    # previously unchecked by CI, so drift between the two (missing variables, stale
    # hardcoded names) merged unnoticed. fmt + validate need no AWS credentials and no
    # provider network access beyond `init -backend=false`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OpenTofu
        # Installed directly rather than via a third-party setup action: one less
        # supply-chain surface, and the checksum pins the binary exactly.
        env:
          TOFU_VERSION: "1.10.6"
          TOFU_SHA256: "15b7bed76420b50da3e121769c43341df8cd57d751ca14e6dbe9c850124c6dac"
        run: |
          set -euo pipefail
          curl -fsSL -o tofu.zip \
            "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"
          echo "${TOFU_SHA256}  tofu.zip" | sha256sum -c -
          unzip -q tofu.zip tofu -d /usr/local/bin
          rm tofu.zip
          tofu version

      - name: Check formatting
        working-directory: terraform
        run: tofu fmt -check -diff -recursive

      - name: Validate configuration
        working-directory: terraform
        # -backend=false: no remote state, no credentials. Downloads the pinned AWS
        # provider so validate can type-check resource arguments.
        run: |
          tofu init -backend=false -input=false
          tofu validate

      - name: Check every CDR_MAX_* env var the code reads is set by both IaC paths
        # A cap the code reads but neither path sets falls back to the in-code default
        # and cannot be tuned without a redeploy — silent, and how four caps went
        # missing from terraform/ (#62). Compare against lambda_function.py, the
        # authority on which names actually exist.
        run: |
          set -euo pipefail
          grep -oE 'os\.environ\.get\("CDR_MAX_[A-Z_]+"' src/lambda_function.py \
            | grep -oE 'CDR_MAX_[A-Z_]+' | sort -u > /tmp/code-vars.txt
          grep -oE 'CDR_MAX_[A-Z_]+' terraform/main.tf | sort -u > /tmp/tf-vars.txt
          grep -oE 'CDR_MAX_[A-Z_]+' src/template.yaml | sort -u > /tmp/sam-vars.txt
          echo "Caps read by lambda_function.py:"; cat /tmp/code-vars.txt
          if ! diff -u /tmp/code-vars.txt /tmp/tf-vars.txt; then
            echo "::error::terraform/main.tf does not set every CDR_MAX_* the code reads (- missing, + unused)"
            exit 1
          fi
          if ! diff -u /tmp/code-vars.txt /tmp/sam-vars.txt; then
            echo "::error::src/template.yaml does not set every CDR_MAX_* the code reads (- missing, + unused)"
            exit 1
          fi

  docker-build:
    # Build the local CDR service container image and verify it serves /healthz. Guards the
    # Dockerfile / local-service deps from rotting; the build is the real regression check
    # for the container/sidecar artifacts (Dockerfile, docker-compose.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t cdr-gateway:ci .

      - name: Run container and check /healthz
        run: |
          docker run -d --rm --name cdr-ci -p 8000:8000 cdr-gateway:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          # Assert the service is actually up and reports ok.
          curl -sf http://127.0.0.1:8000/healthz | grep -q '"status":"ok"'
          # Assert it runs as the non-root cdr user (uid 10001).
          test "$(docker exec cdr-ci id -u)" = "10001"
          docker stop cdr-ci

      - name: Validate docker-compose.yml
        run: docker compose config >/dev/null
